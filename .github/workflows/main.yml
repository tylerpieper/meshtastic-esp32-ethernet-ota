name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"

  workflow_dispatch:
    inputs:
      create_release:
        description: Create release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  version:
    if: inputs.create_release == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(cat version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
    outputs:
      version: ${{ steps.version.outputs.version }}

  build:
    name: build (${{ matrix.pio_env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pio_env: station-g3-waveshare-eth-ota
          - pio_env: t-eth-elite-ota
          - pio_env: t-connect-pro-ota
          - pio_env: esp32s3-dm9051-ota
          - pio_env: esp32s3-ksz8851-ota
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python Dependencies (PlatformIO)
        run: pip install -r requirements.txt

      - name: Build ${{ matrix.pio_env }}
        env:
          PIO_ENV: ${{ matrix.pio_env }}
        run: pio run -e $PIO_ENV

      - name: Rename firmware binary
        run: mv .pio/build/${{ matrix.pio_env }}/firmware.bin .pio/build/mt-${{ matrix.pio_env }}.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pio_env }}
          path: .pio/build/mt-${{ matrix.pio_env }}.bin

  release:
    runs-on: ubuntu-latest
    if: inputs.create_release == true
    needs: [version, build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        id: create_release
        with:
          draft: false
          prerelease: false
          name: Meshtastic ESP32 Ethernet OTA v${{ needs.version.outputs.version }}
          generate_release_notes: true
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            mt-*-ota.bin
