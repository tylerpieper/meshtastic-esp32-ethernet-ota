[platformio]
src_dir = src

[common]
; Pin platform to v6.12.0 — v7.0.1 (latest HEAD) calls linker_script_preprocessor.cmake,
; which only exists in IDF 6.0+. With framework-espidf@3.50500.0 (IDF 5.5.0) this fails
; with 'CMake Error: Not a file: linker_script_preprocessor.cmake' during linker script
; preprocessing. v6.12.0 uses linker_script_generator.cmake which DOES exist in IDF 5.5.0.
platform = platformio/espressif32@6.12.0
framework = espidf
platform_packages =
    platformio/framework-espidf@3.50500.0
monitor_speed = 115200

board_build.partitions = meshtastic-4mb.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 655360

extra_scripts =
    post:extra_script_sizecheck.py

build_flags =
    -fno-exceptions
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DCORE_DEBUG_LEVEL=0

# Waveshare ESP32-S3-ETH / Station G3 Ethernet (W5500) + BLE OTA
[env:esp32s3-eth]
extends = common
board = esp32-s3-devkitc-1
board_upload.maximum_size = 655360
board_upload.flash_address = 0x650000
upload_command = esptool.py -p $UPLOAD_PORT write_flash ${this.board_upload.flash_address} $SOURCE
board_build.cmake_extra_args = -DENABLE_BLE_OTA=ON -DENABLE_WIFI_OTA=OFF -DENABLE_ETH_OTA=ON
build_flags =
    ${common.build_flags}
    -DETH_MODULE_TYPE=ETH_MODULE_W5500
    -DETH_MOSI_PIN=11
    -DETH_MISO_PIN=12
    -DETH_SCLK_PIN=13
    -DETH_CS_PIN=14
    -DETH_INT_PIN=10
    -DETH_RST_PIN=9
    -DETH_SPI_HOST=SPI3_HOST

[env:station-g3-waveshare-eth-ota]
extends = env:esp32s3-eth

